spring.application.name=expense-approval-system

server.port=${PORT:8084}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

security.jwt.reset-expiration=${JWT_RESET_EXPIRATION:120000}
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:None}
security.refresh-cookie.path=${REFRESH_COOKIE_PATH:/api/auth}
security.refresh-cookie.max-age=${REFRESH_COOKIE_MAX_AGE:604800}
security.invitation.expiration-hours=${INVITATION_EXPIRATION_HOURS:72}
app.invitation.accept-url=${INVITATION_ACCEPT_URL:http://localhost:5173/accept-invitation}
app.mail.from=${MAIL_FROM:no-reply@example.com}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

logging.level.com.siva.expense_approval_system.application.impl=INFO
logging.level.org.springframework.security=INFO

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1